  CYCLONEDDS_URI: '<CycloneDDS><Domain><General><Interfaces><NetworkInterface name="wlP1p1s0" priority="default" multicast="default" /></Interfaces></General></Domain></CycloneDDS>'
  RCUTILS_COLORIZED_OUTPUT: "1"

