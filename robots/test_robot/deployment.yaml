# Reviewed, non-secret runtime manifest for exactly one robot.
# Values in environment are written to runtime.env and injected into every
# component container; do not place credentials here.
environment:
  SORACCEL_ROBOT_ID: test_robot
  ROS_DOMAIN_ID: "0"
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  CYCLONEDDS_URI: '<CycloneDDS><Domain><General><Interfaces><NetworkInterface name="wlP1p1s0" priority="default" multicast="default" /></Interfaces></General></Domain></CycloneDDS>'
  RCUTILS_COLORIZED_OUTPUT: "1"

components:
  mapping_3d:
    image: ghcr.io/soraccel/mapping_3d:v0.1.3@sha256:6c6839ca12b9145001c6de1ff052257fc88cb3159879937ce5976ef24f2d22a6
    enabled_at_boot: []
