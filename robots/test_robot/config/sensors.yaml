sensors:
  ros__parameters:
    usb_cameras:
      default:
        width: 640
        height: 480
        pixel_format: YUYV
        output_encoding: rgb8
        framerate: 15.0
        # Stable quality controls for the current Sunplus USB cameras.
        # Higher resolutions were tested but overloaded the current USB 2.1
        # RealSense path on local-nano.
        focus_automatic_continuous: true
        power_line_frequency: 1
        sharpness: 3
        white_balance_automatic: true
      cameras:
        - name: rgb_front
          device: /dev/video10
          namespace: ${SORACCEL_ROBOT_ID}/sensors/cameras/rgb_front
          frame_id: rgb_front_optical_frame
          enabled: true
        - name: rgb_rear
          device: /dev/video0
          namespace: ${SORACCEL_ROBOT_ID}/sensors/cameras/rgb_rear
          frame_id: rgb_rear_optical_frame
          enabled: true
    realsense_cameras:
      default:
        initial_reset: true
        enable_color: false
        enable_depth: true
        enable_infra1: false
        enable_infra2: false
        enable_gyro: false
        enable_accel: false
        unite_imu_method: 0
        align_depth.enable: false
        pointcloud.enable: false
        depth_module.depth_profile: 480x270x15
      cameras:
        - name: depth_rear
          namespace: ${SORACCEL_ROBOT_ID}/sensors/cameras
          usb_port_id: 1-2.4.2
          enabled: true
        - name: depth_front
          namespace: ${SORACCEL_ROBOT_ID}/sensors/cameras
          usb_port_id: 1-2.4.3
          enabled: true
