name: Validate deployment manifests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes python3-yaml
      - run: python3 - <<'PY'
          import pathlib
          import yaml
          for path in pathlib.Path("robots").glob("*/deployment.yaml"):
              data = yaml.safe_load(path.read_text())
              assert isinstance(data.get("components"), dict) and data["components"]
              for name, component in data["components"].items():
                  assert "@sha256:" in component["image"], name
                  assert isinstance(component.get("enabled_at_boot", []), list), name
          PY
